name: Core update review policy

# Automatic merging of upstream pin-only bumps is disabled. This fork resolves its
# customized Core through core-source-lock.json and the reviewed source snapshot.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual review requirement
        run: echo "Review upstream changes, validate the customized Core, then publish its snapshot and lock. Pin-only updates do not update this app's Core."
