name: Android CI

# Every pull request validates the customized snapshot, App and both Core modules.
# Upstream catalogue-only bumps require review and receive the same checks.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          # 'tools' is obsolete and Google removed it from the SDK repository; the
          # action still asks for it by default, which fails the whole setup step.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Resolve core
        uses: ./.github/actions/resolve-core

      # One variant, not `test`/`lint` across every flavor: standard+debug is the variant the JVM
      # tests are written against, and the ABI flavors differ only in the packaged native libs.
      - name: Snapshot publication regression tests
        run: |
          python3 -m unittest discover -s tools/core_snapshot -p 'test_*.py'
          python3 -m unittest discover -s tools/release -p 'test_*.py'

      - name: App and customized Core unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testStandardDebugUnitTest :OwnTV_Core:core:testDebugUnitTest :OwnTV_Core:player-core:testDebugUnitTest --stacktrace

      # abortOnError = true in app/build.gradle.kts, so this fails the job on a lint error.
      - name: Lint
        if: always()   # report both verdicts in one run instead of one failure at a time
        run: ./gradlew :app:lintStandardDebug :app:lintVitalStandardRelease --stacktrace

      - name: Upload test and lint reports
        if: always()   # the reports matter most when the step above failed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: check-reports
          include-hidden-files: true
          path: |
            app/build/reports/tests/**
            .gradle/core-snapshot/**/OwnTV_Core/core/build/reports/tests/**
            .gradle/core-snapshot/**/OwnTV_Core/player-core/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn

  build:
    needs: check
    # PRs get the check job only — no APK, no release. Unchanged from ac33c65.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Set at runtime via $GITHUB_ENV in the "Name the APK" step. Declared here (empty) so static
      # linters don't flag the later ${{ env.APK_OUT }} references as "context access might be invalid".
      APK_OUT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'   # matches gradle/gradle-daemon-jvm.properties (toolchainVersion=21)

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          # 'tools' is obsolete and Google removed it from the SDK repository; the
          # action still asks for it by default, which fails the whole setup step.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Resolve core
        uses: ./.github/actions/resolve-core

      - name: Compute and validate the single release version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            test -n "$RELEASE_CERT_SHA256"
            sdkmanager 'build-tools;36.0.0' > /dev/null
            python3 tools/release/version.py --tag "$GITHUB_REF_NAME" --github-release >> "$GITHUB_OUTPUT"
          else
            python3 tools/release/version.py >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Runs on every push (not just tags) so dev builds are also signed RELEASE builds —
          # required since R8 was enabled: only assembleRelease exercises shrinking/keep rules,
          # and a release-signed dev APK installs straight over a published release for testing.
          # Pull requests run checks only. Non-tag pushes without a key build a development APK.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            if [ "$IS_TAG" = "true" ]; then
              echo "::error::Release signing is required for a tag build."
              exit 1
            fi
            echo "No release key: a development debug artifact will be built."
          fi

      # Derives this release's edge key for the default metadata/subtitle service. Falls back to the
      # static OWNTV_EDGE_KEY, then to "" — a fork has neither secret and the app uses its open base
      # URL, exactly as before.
      - name: Derive the release edge key
        env:
          OWNTV_EDGE_MASTER: ${{ secrets.OWNTV_EDGE_MASTER }}
          OWNTV_EDGE_KEY: ${{ secrets.OWNTV_EDGE_KEY }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          if [ -n "$OWNTV_EDGE_MASTER" ]; then
            # No trailing newline in the input; the server derives it the same way.
            KEY=$(printf '%s' "$VERSION_NAME" \
              | openssl dgst -sha256 -hmac "$OWNTV_EDGE_MASTER" -hex \
              | awk '{print $NF}')
            echo "::add-mask::$KEY"
            echo "OWNTV_EDGE_KEY=$KEY" >> "$GITHUB_ENV"
            echo "Derived the edge key for $VERSION_NAME."
          elif [ -n "$OWNTV_EDGE_KEY" ]; then
            echo "::add-mask::$OWNTV_EDGE_KEY"
            echo "OWNTV_EDGE_KEY=$OWNTV_EDGE_KEY" >> "$GITHUB_ENV"
            echo "No OWNTV_EDGE_MASTER — using the static edge key."
          else
            echo "No edge secret configured (fork build) — the app will use the unprotected base URL."
          fi

      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # OWNTV_EDGE_KEY is exported into $GITHUB_ENV by the step above; app/build.gradle.kts reads
          # it as the env var it always did.
        run: |
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "Building signed release APKs (both ABI flavors)"
            ./gradlew assembleRelease --stacktrace
            # Product flavors split the output by flavor subfolder:
            #   standard/release  -> arm (arm64-v8a + armeabi-v7a) — the main download
            #   x86_64/release    -> x86_64 — emulator / rare x86 box
            ARM_SRC=app/build/outputs/apk/standard/release/app-standard-universal-release.apk
            test -f "$ARM_SRC"
            unzip -Z1 "$ARM_SRC" | awk '/^lib\/arm64-v8a\/.*\.so$/ { a=1 } /^lib\/armeabi-v7a\/.*\.so$/ { b=1 } END { exit !(a && b) }'
            X86_SRC=$(python3 tools/release/select_apk.py app/build/outputs/apk/x86_64/release --abis x86_64)
            test -f "$X86_SRC"
            echo "Built arm:    $ARM_SRC"
            echo "Built x86_64: $X86_SRC"
            echo "ARM_SRC=$ARM_SRC" >> "$GITHUB_ENV"
            echo "X86_SRC=$X86_SRC" >> "$GITHUB_ENV"
          else
            echo "Building debug APK"
            ./gradlew assembleDebug
            # Debug also builds both flavors; standard (arm) is the one most likely to be tested on a
            # real device. Surface it as the primary artifact; x86_64 debug is still in its folder.
            SRC=app/build/outputs/apk/standard/debug/app-standard-universal-debug.apk
            test -f "$SRC"
            echo "Built: $SRC"
            echo "ARM_SRC=$SRC" >> "$GITHUB_ENV"
          fi

      - name: Name the APK (OwnTV-v<version>)
        run: |
          mkdir -p dist
          if [ "$IS_TAG" = "true" ]; then
            OUT="OwnTV-v${{ steps.ver.outputs.name }}.apk"
          else
            OUT="OwnTV-dev-${GITHUB_SHA::7}.apk"
          fi
          cp "$ARM_SRC" "dist/$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"
          echo "Packaged dist/$OUT (arm: arm64-v8a + armeabi-v7a)"
          # Tag builds also ship a stable-named copy so a fixed URL always serves the latest signed
          # release: https://github.com/<repo>/releases/latest/download/OwnTV.apk
          # (used by the Fire TV Downloader code and any "always-latest" sideload link).
          if [ "$IS_TAG" = "true" ]; then
            cp "$ARM_SRC" "dist/OwnTV.apk"
            # Separate x86_64 build for emulators / rare Intel boxes. Pinned to the version only —
            # no always-latest copy, since real devices (the Downloader audience) don't need it.
            if [ -n "$X86_SRC" ]; then
              cp "$X86_SRC" "dist/OwnTV-x86_64-v${{ steps.ver.outputs.name }}.apk"
              echo "Packaged dist/OwnTV-x86_64-v${{ steps.ver.outputs.name }}.apk"
            fi
          fi

      - name: Extract release notes from CHANGELOG_APP.md
        if: env.IS_TAG == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The release body is what the in-app updater shows as "What's new", so it must be the
          # SHORT, bullet-only notes from CHANGELOG_APP.md — never CHANGELOG.md, which is the long
          # developer/contributor changelog and is read manually on GitHub.
          #
          # This runs here rather than only in release-notes.yml because a release published by
          # GITHUB_TOKEN does not trigger other workflows, so that job never fires for tag builds.
          # It stays as a fallback for releases published by hand from the GitHub UI.
          #
          # Take "## <tag>" up to the next "## v" header; the header may carry a date/"unreleased"
          # tail ("## v4.1.5 — 2026-07-26") or nothing at all, so match the version as a whole word.
          if [ -f CHANGELOG_APP.md ]; then
            awk -v ver="$TAG" '
              $0 ~ ("^## " ver "([ \t]|$)") { flag=1; next }
              /^## v/ && flag { flag=0 }
              flag { print }
            ' CHANGELOG_APP.md > dist/RELEASE_NOTES.md || true
            # Trim leading/trailing blank lines.
            sed -i -e '/./,$!d' dist/RELEASE_NOTES.md
            awk 'NF{p=NR} {a[NR]=$0} END{for(i=1;i<=p;i++) print a[i]}' \
              dist/RELEASE_NOTES.md > dist/RELEASE_NOTES.trimmed.md
            mv dist/RELEASE_NOTES.trimmed.md dist/RELEASE_NOTES.md
          fi
          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "::warning::No CHANGELOG_APP.md section for $TAG — publishing a placeholder body."
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md) for details." \
              > dist/RELEASE_NOTES.md
          fi
          echo "--- Release notes ---"
          cat dist/RELEASE_NOTES.md

      - name: Verify signed release artifacts
        if: env.IS_TAG == 'true'
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          test -n "$RELEASE_CERT_SHA256"
          python3 tools/release/verify_artifact.py "dist/$APK_OUT" --build-tools "$BUILD_TOOLS" --name "${{ steps.ver.outputs.name }}" --code "${{ steps.ver.outputs.code }}" --certificate-sha256 "$RELEASE_CERT_SHA256" --abis arm64-v8a armeabi-v7a > dist/arm.json
          python3 tools/release/verify_artifact.py "dist/OwnTV-x86_64-v${{ steps.ver.outputs.name }}.apk" --build-tools "$BUILD_TOOLS" --name "${{ steps.ver.outputs.name }}" --code "${{ steps.ver.outputs.code }}" --certificate-sha256 "$RELEASE_CERT_SHA256" --abis x86_64 > dist/x86.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          records = [json.loads(Path('dist/arm.json').read_text()), json.loads(Path('dist/x86.json').read_text())]
          alias = dict(records[0], file='OwnTV.apk')
          Path('dist/release.json').write_text(json.dumps(records + [alias], indent=2))
          Path('dist/arm.json').unlink()
          Path('dist/x86.json').unlink()
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          # Upload the whole dist/ so both the arm APK and the x86_64 APK are captured.
          name: owntv-package
          path: dist/*
          if-no-files-found: error

  android-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api: [26, 34]
      fail-fast: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - uses: ./.github/actions/resolve-core
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: chmod +x ./gradlew && ./gradlew :OwnTV_Core:core:connectedDebugAndroidTest --stacktrace

  release:
    needs: [build, android-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owntv-package
          path: dist
      - name: Check distribution hashes before publishing
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('dist')
          for asset in json.loads((root / 'release.json').read_text()):
              assert Path(asset['file']).name == asset['file']
              assert hashlib.sha256((root / asset['file']).read_bytes()).hexdigest() == asset['sha256']
          PY
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: OwnTV ${{ github.ref_name }}
          files: |
            dist/*.apk
            dist/release.json
          fail_on_unmatched_files: true
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
