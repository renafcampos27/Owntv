name: Resolve customized core
description: Verify the customized Core source snapshot used by both local and CI builds.
runs:
  using: composite
  steps:
    - name: Verify customized Core snapshot
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import hashlib, json, zipfile
        from pathlib import Path
        lock = json.loads(Path('core-source-lock.json').read_text(encoding='utf-8'))
        archive = Path(lock['archive'])
        assert archive.is_file(), 'Customized Core source snapshot is missing'
        assert hashlib.sha256(archive.read_bytes()).hexdigest() == lock['sha256'], 'Core source checksum mismatch'
        with zipfile.ZipFile(archive) as source:
            assert source.testzip() is None, 'Core source ZIP is damaged'
            assert json.loads(source.read('tools/i18n/locales.json')) == json.loads(
                Path('tools/i18n/locales.json').read_text(encoding='utf-8')
            ), 'App locale catalogue differs from the customized Core snapshot'
        print('Customized Core', lock['version'], 'source SHA-256', lock['sha256'])
        PYCODE
        echo "ORG_GRADLE_PROJECT_owntvUseCoreSnapshot=true" >> "$GITHUB_ENV"
        # settings.gradle.kts verifies and extracts the same snapshot; no package token or old tag.
